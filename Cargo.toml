[package]
name = "nixdiag"
version = "0.2.0"
edition = "2021"
description = "Static infrastructure docs from any Nix flake"
license = "MIT"

[dependencies]
anyhow = "1"
bytesize = "2"
charts-rs = "1"
clap = { version = "4", features = ["derive"] }
dot-writer = "0.1"
indexmap = { version = "2", features = ["serde"] }
itertools = "0.15"
jiff = { version = "0.2", default-features = false, features = ["std"] }
num-format = "0.4"
path-clean = "1"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = { version = "0.22", default-features = false, features = ["std"] }
thiserror = "2"
toml = "1"
url = "2"
