name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - id: audit
        run: nix run .#audit > report.md
        continue-on-error: true

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --search 'adapter audit in:title' --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh issue create --title "adapter audit" --body-file report.md
          else
            gh issue edit "$number" --body-file report.md
          fi

      - if: steps.audit.outcome == 'failure'
        run: exit 1
