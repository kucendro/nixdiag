name: monitor

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: Europe/Prague
  workflow_dispatch:

permissions:
  contents: write

jobs:
  head:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: master, vm: "eval --raw" }
          - { ref: nixos-unstable, vm: "build --no-link -L" }
          - { ref: nixos-26.05, vm: "build --no-link -L" }
    steps:
      - uses: actions/checkout@v4

      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - run: |
          nixpkgs="github:NixOS/nixpkgs/${{ matrix.ref }}"
          rev=$(nix flake metadata --json "$nixpkgs" | jq -r .revision)
          head=(--override-input nixpkgs "$nixpkgs" --no-write-lock-file)
          vm=ok
          vms=$(nix eval --raw .#checks.x86_64-linux "${head[@]}" --apply 'c: toString (builtins.filter (n: builtins.substring 0 3 n == "vm-") (builtins.attrNames c))') || vm=failed
          for c in $vms; do
            nix ${{ matrix.vm }} ".#checks.x86_64-linux.$c" "${head[@]}" || vm=failed
          done
          nix run .#audit -- --json "$nixpkgs" > audit.json || true
          jq -n --arg ref "${{ matrix.ref }}" --arg rev "$rev" --arg date "$(date -u +%F)" --arg vm "$vm" \
            --slurpfile audit audit.json '{ ref: $ref, rev: $rev, date: $date, vm: $vm, audit: $audit }' > record.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ref }}
          path: record.json

  record:
    needs: head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/records

      - run: |
          for d in */; do [ -e "$RUNNER_TEMP/records/${d%/}" ] || git rm -rq "$d"; done
          for f in "$RUNNER_TEMP"/records/*/record.json; do
            ref=$(jq -r .ref "$f")
            mkdir -p "$ref"
            cp "$f" "$ref/$(jq -r .date "$f").json"
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "monitor $(date -u +%F)"
          git push

      - run: jq -es 'all(.[]; .vm == "ok" and all(.audit[]; .status != "broken"))' "$RUNNER_TEMP"/records/*/record.json

  issues:
    needs: head
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/records

      - run: |
          nix eval --json .#lib.adapters --apply 'builtins.mapAttrs (_: a: a.maintainers)' > maintainers.json
          gh label create monitor --force --description "Opened by the monitor workflow"
          gh issue list --label monitor --limit 100 --json number,title,body > open.json
          jq -sc --slurpfile maintainers maintainers.json --slurpfile open open.json -f nix/issues.jq "$RUNNER_TEMP"/records/*/record.json > gh.jsonl
          while read -r argv; do jq -j '.[] + "\u0000"' <<<"$argv" | xargs -0 gh; done < gh.jsonl
