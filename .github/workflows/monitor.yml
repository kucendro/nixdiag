name: monitor

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: Europe/Prague
  workflow_dispatch:

permissions:
  contents: write

jobs:
  head:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [master, nixos-unstable, nixos-25.05]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: |
          nixpkgs="github:NixOS/nixpkgs/${{ matrix.ref }}"
          rev=$(nix flake metadata --json "$nixpkgs" | jq -r .revision)
          topology() {
            jq -S '.hosts | map_values(.topology)' "$(nix build .#fixture-facts "$@" --no-write-lock-file --no-link --print-out-paths)"
          }
          if diff <(topology) <(topology --override-input nixpkgs "$nixpkgs"); then eval=ok; else eval=changed; fi
          nix run .#audit -- --json "$nixpkgs" > audit.json || true
          jq -n --arg ref "${{ matrix.ref }}" --arg rev "$rev" --arg date "$(date -u +%F)" --arg eval "$eval" \
            --slurpfile audit audit.json '{ ref: $ref, rev: $rev, date: $date, eval: $eval, audit: $audit }' > record.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ref }}
          path: record.json

  record:
    needs: head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/records

      - run: |
          for f in "$RUNNER_TEMP"/records/*/record.json; do
            ref=$(jq -r .ref "$f")
            mkdir -p "$ref"
            cp "$f" "$ref/$(jq -r .date "$f").json"
          done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "monitor $(date -u +%F)"
          git push

      - run: jq -es 'all(.[]; .eval == "ok" and all(.audit[]; .status != "broken"))' "$RUNNER_TEMP"/records/*/record.json
